name: daily-sync

on:
  schedule:
    - cron: "30 11 * * *"          # daily
  workflow_dispatch:                
    inputs:
      task:
        description: "daily | producthunt | launches | revenue | funded | chrome | shopify | retag | push | selftest | verify | report"
        required: true
        default: daily
      limit:
        description: "max items for a single list run (blank = list default)"
        required: false
        default: ""
      args:
        description: "extra flags, e.g. --day 2026-10-08 --min-votes 50, or --apply for push"
        required: false
        default: ""

concurrency:
  group: daily-sync              # never two runs writing at once
  cancel-in-progress: false

permissions:
  actions: read          # report.py counts this month's Actions minutes
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      REOON_API_KEY: ${{ secrets.REOON_API_KEY }}
      PH_TOKEN: ${{ secrets.PH_TOKEN }}
      INSTANTLY_API_KEY: ${{ secrets.INSTANTLY_API_KEY }}
      PH_RESOLVER_URL: ${{ secrets.PH_RESOLVER_URL }}
      PH_RESOLVER_SECRET: ${{ secrets.PH_RESOLVER_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GUMLOOP_API_KEY: ${{ secrets.GUMLOOP_API_KEY }}
      GUMLOOP_USER_ID: ${{ secrets.GUMLOOP_USER_ID }}
      GUMLOOP_AGENT_ID: ${{ secrets.GUMLOOP_AGENT_ID }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PY: python
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: run
        run: |
          set -o pipefail
          T="${{ github.event.inputs.task || 'daily' }}"
          L="${{ github.event.inputs.limit }}"
          A="${{ github.event.inputs.args }}"
          case "$T" in
            daily) bash daily.sh; cat cache/daily-*.log ;;
            push)  python push_lists.py $A ;;
            retag) python run.py retag ;;
            selftest) python run.py selftest ;;
            verify) python verify.py $A ;;
            report) python report.py $A ;;
            *)     python run.py "$T" ${L:+--limit "$L"} $A ;;
          esac
